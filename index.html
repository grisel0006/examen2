<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Detallado de Producto</title>
    <!-- Importamos Bootstrap desde CDN para estilos responsivos y componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Importamos Vue 3 desde CDN para la lógica reactiva -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; }
        .form-label { font-weight: 500; color: #495057; }
        .form-control:focus, .form-select:focus { border-color: #71dd37; box-shadow: 0 0 0 0.2rem rgba(113, 221, 55, 0.25); }
        .btn-success { background-color: #71dd37; border-color: #71dd37; }
        .btn-success:hover { background-color: #61cc2c; border-color: #61cc2c; }
    </style>
</head>
<body>

<div id="app" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="card-title mb-0">Nuevo Producto - Información Detallada</h5>
                    <p class="mb-0 small text-light-50">Complete todos los campos para registrar el producto en el inventario.</p>
                </div>
                <div class="card-body p-4">
                    <!-- El formulario responsivo usando la rejilla de Bootstrap (g-4 para espaciado) -->
                    <form @submit.prevent="enviarFormulario" class="row g-4">
                        
                        <!-- Sección de Identificación -->
                        <div class="col-12 col-md-6">
                            <label for="productName" class="form-label">Nombre del Producto *</label>
                            <input v-model="formulario.nombre" type="text" id="productName" class="form-control" placeholder="Ej: Monitor Gamer LG 27''" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label for="productSKU" class="form-label">Código SKU / Modelo *</label>
                            <input v-model="formulario.sku" type="text" id="productSKU" class="form-control" placeholder="Ej: LG-27UL500-W" required>
                        </div>

                        <!-- Sección de Categoría y Descripción -->
                        <div class="col-12 col-md-6">
                            <label for="productCategory" class="form-label">Categoría *</label>
                            <select v-model="formulario.categoria" id="productCategory" class="form-select" required>
                                <option value="" disabled selected>Seleccione una categoría</option>
                                <option>Electrónica</option>
                                <option>Informática</option>
                                <option>Hogar</option>
                                <option>Deportes</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="productDescription" class="form-label">Descripción</label>
                            <textarea v-model="formulario.descripcion" id="productDescription" class="form-control" rows="3" placeholder="Breve descripción de las características clave..."></textarea>
                        </div>

                        <!-- Sección de Costos y Stock -->
                        <div class="col-12 col-md-4">
                            <label for="productCost" class="form-label">Costo de Compra ($) *</label>
                            <input v-model.number="formulario.costo" type="number" step="0.01" min="0" id="productCost" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="productPrice" class="form-label">Precio de Venta ($) *</label>
                            <input v-model.number="formulario.precio" type="number" step="0.01" min="0" id="productPrice" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="productStock" class="form-label">Stock Inicial *</label>
                            <input v-model.number="formulario.stock" type="number" min="0" id="productStock" class="form-control" placeholder="0" required>
                        </div>

                        <!-- Sección de Ubicación y Estado -->
                        <div class="col-12 col-md-6">
                            <label for="productLocation" class="form-label">Ubicación (Almacén/Estante)</label>
                            <input v-model="formulario.ubicacion" type="text" id="productLocation" class="form-control" placeholder="Ej: A-1-3">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Estado de Publicación *</label>
                            <div class="d-flex gap-3 pt-2">
                                <div class="form-check">
                                    <input v-model="formulario.estado" type="radio" value="published" id="statePublished" class="form-check-input" name="productState" checked required>
                                    <label class="form-check-label" for="statePublished">Publicado</label>
                                </div>
                                <div class="form-check">
                                    <input v-model="formulario.estado" type="radio" value="draft" id="stateDraft" class="form-check-input" name="productState" required>
                                    <label class="form-check-label" for="stateDraft">Borrador</label>
                                </div>
                            </div>
                        </div>

                        <!-- Sección de Imagen (Simulada) -->
                        <div class="col-12">
                            <label for="productImage" class="form-label">Imagen del Producto (URL)</label>
                            <input v-model="formulario.imageUrl" type="url" id="productImage" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="col-12 pt-3 border-top mt-4 d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary">Cancelar</button>
                            <button type="submit" class="btn btn-success px-4">
                                <span class="d-none d-sm-inline">Registrar</span> Producto
                            </button>
                        </div>
                        
                    </form>
                </div>
            </div>
            <div class="text-center mt-3 text-muted small">
                © 2026 Sistema de Gestión de Inventario - v1.2
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue

    createApp({
        setup() {
            // El objeto reactivo que ahora incluye más campos
            const formulario = ref({
                nombre: '',
                sku: '',
                categoria: '',
                descripcion: '',
                costo: 0,
                precio: 0,
                stock: 0,
                ubicacion: '',
                estado: 'published',
                imageUrl: ''
            })

            // Función para enviar el formulario con la nueva lógica
            const enviarFormulario = () => {
                // Validación básica de stock para cumplir con el requisito original
                if (formulario.value.stock > 0 && formulario.value.precio > 0 && formulario.value.nombre) {
                    // Simulación de éxito
                    alert('Producto registrado exitosamente en el inventario:\n\n' + JSON.stringify(formulario.value, null, 2));
                    
                    // Limpieza de campos al valor predeterminado
                    formulario.value = {
                        nombre: '',
                        sku: '',
                        categoria: '',
                        descripcion: '',
                        costo: 0,
                        precio: 0,
                        stock: 0,
                        ubicacion: '',
                        estado: 'published',
                        imageUrl: ''
                    }
                } else {
                    // Alertas personalizadas
                    let missing = [];
                    if (!formulario.value.nombre) missing.push("Nombre");
                    if (formulario.value.precio <= 0) missing.push("Precio (mayor a 0)");
                    if (formulario.value.stock <= 0) missing.push("Stock (mayor a 0)");
                    
                    alert('Por favor complete los campos obligatorios:\n\n- ' + missing.join("\n- "));
                }
            }

            return {
                formulario,
                enviarFormulario
            }
        }
    }).mount('#app')
</script>
</body>
</html>
